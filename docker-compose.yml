version: '3.8'

services:
  db:
    image: postgres:14-alpine
    container_name: nuraga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: nuraga-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - CORS_ORIGIN=http://localhost:5173
      - DB_USER=postgres
      - DB_USERNAME=postgres
      - DB_PASS=change-me
      - DB_PASSWORD=change-me
      - DB_NAME=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DIALECT=postgres
      - JWT_SECRET=rahasia_nuraga_k3_super_aman
      - AI_SERVICE_URL=http://aiservice:8000
    depends_on:
      - db
      - aiservice
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/wa_session:/app/wa_session

  frontend:
    build: ./frontend
    container_name: nuraga-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api
      - VITE_BACKEND_BASE_URL=http://localhost:5000
      - VITE_SOCKET_URL=http://localhost:5000
    depends_on:
      - backend

  aiservice:
    build: ./aiservice
    container_name: nuraga-aiservice
    restart: unless-stopped
    ports:
      - "8000:8000"

volumes:
  pgdata:
